<!DOCTYPE html>
<html lang="ko">
<head>

  <title>테스트 HTML 인덱스</title>
  <style>

      font-size: 22px;
      margin: 0 0 14px;

      color: #bdd2ef;
      line-height: 1.6;
    }
    .card {
      border: 1px solid rgba(255, 255, 255, 0.2);

      background: rgba(255, 255, 255, 0.05);

    }
    .title {
      font-weight: 700;

    }

      text-decoration: none;
    }
    code {

      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
    }
