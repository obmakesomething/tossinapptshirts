steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/merchandisegpt-api:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/merchandisegpt-api:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/merchandisegpt-api:latest
      - --region
      - $_REGION
      - --platform
      - managed
      - --allow-unauthenticated
      - --quiet

substitutions:
  _SERVICE: merchandisegpt-api
  _REGION: asia-northeast3

images:
  - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/merchandisegpt-api:latest

options:
  logging: CLOUD_LOGGING_ONLY
