<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIT 현지기기 로컬 동시 미리보기</title>
  <style>
    :root {
      --bg: #071a35;
      --phone-iphone-width: 393px;
      --phone-iphone-height: 852px;
      --phone-galaxy-width: 360px;
      --phone-galaxy-height: 800px;
      --phone-radius-iphone: 26px;
      --phone-radius-galaxy: 22px;
      --line: rgba(255,255,255,.2);
      --text: #dbe7ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(1100px 800px at 100% -10%, rgba(72,130,255,.18), transparent 45%), var(--bg);
      color: var(--text);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      padding: 12px;
      display: grid;
      gap: 12px;
      justify-content: center;
    }

    .title {
      font-weight: 800;
      font-size: 16px;
      color: #edf5ff;
      text-align: center;
      letter-spacing: .02em;
    }

    .frames {
      display: grid;
      gap: 12px;
      grid-template-columns: minmax(280px, 390px) minmax(280px, 390px);
      justify-content: center;
      align-items: start;
    }

    .frame-wrap {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(9, 22, 43, .68);
      padding: 8px;
      display: grid;
      gap: 8px;
      box-shadow: 0 20px 55px rgba(0,0,0,.45);
    }

    .frame-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      font-size: 12px;
      color: #bfd1f2;
      font-weight: 700;
    }

    .frame {
      width: var(--phone-iphone-width);
      height: var(--phone-iphone-height);
      border: 0;
      border-radius: var(--phone-radius-iphone);
      background: #000;
      display: block;
    }
    .frame.device-galaxy {
      width: var(--phone-galaxy-width);
      height: var(--phone-galaxy-height);
      border-radius: var(--phone-radius-galaxy);
    }

    .hint {
      text-align: center;
      color: #9fb7d6;
      font-size: 12px;
      line-height: 1.6;
      max-width: 820px;
    }

    @media (max-width: 920px) {
      .frames {
        grid-template-columns: 1fr;
      }

      .frame { width: min(390px, calc(100vw - 36px)); }
    }
  </style>
</head>
<body>
  <div class="title">AIT 화면 아이폰 / 갤럭시 각각 로컬 동시 띄우기</div>

  <div class="frames">
    <section class="frame-wrap">
      <div class="frame-head"><span>iPhone</span><span>http://localhost:4173/current-ait-preview.html?device=iphone</span></div>
      <iframe
        class="frame device-iphone"
        src="./current-ait-preview.html?device=iphone"
        title="iPhone local preview"
        loading="eager">
      </iframe>
    </section>

    <section class="frame-wrap">
      <div class="frame-head"><span>Galaxy</span><span>http://localhost:4173/current-ait-preview.html?device=galaxy</span></div>
      <iframe
        class="frame device-galaxy"
        src="./current-ait-preview.html?device=galaxy"
        title="Galaxy local preview"
        loading="eager">
      </iframe>
    </section>
  </div>

  <p class="hint">현재 페이지에서 두 뷰가 동시에 렌더링됩니다. 로컬에서만 보고 싶으면 아래처럼 두 URL도 별도 탭으로 열 수 있어요.</p>
</body>
</html>
