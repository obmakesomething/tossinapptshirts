<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테스트 HTML 인덱스</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #0b172d;
      color: #e8f1ff;
      max-width: 720px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 14px;
    }
    p {
      color: #bdd2ef;
      line-height: 1.6;
    }
    .card {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 14px;
      margin-top: 12px;
    }
    .title {
      font-weight: 700;
      margin-bottom: 6px;
    }
    a {
      color: #ff8b52;
      text-decoration: none;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>테스트 HTML 정리</h1>
  <p>디자인 기준은 아래 원본 HTML 한 곳으로 고정합니다.</p>

  <div class="card">
    <div class="title">1) 그래디언트/풀 플로우 디자이너 HTML (기준)</div>
    <p>
      경로: <code>/Users/daeyounglee/tshirtsmaker-work/index.html</code><br />
      열기: <a href="file:///Users/daeyounglee/tshirtsmaker-work/index.html">file:///Users/daeyounglee/tshirtsmaker-work/index.html</a>
    </p>
  </div>

  <div class="card">
    <div class="title">고정 기준 안내</div>
    <p>
      앞으로 디자인 확인은 <code>/Users/daeyounglee/tshirtsmaker-work/index.html</code>만 기준으로 진행합니다.
    </p>
  </div>
</body>
</html>
